<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Try out CBT seleksi substansi BCKS</title>
<style>
:root{--bg:#f7f6f2;--fg:#1d1d1b;--mu:#6b6a63;--cd:#fff;--bd:#dcdad0;--ac:#1f5c4d;--ok:#1b7a43;--no:#b3261e;--fl:#b7791f;--sel:#e3efeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--fg:#ecebe5;--mu:#a09f96;--cd:#212220;--bd:#3a3b37;--ac:#5fb59f;--ok:#58c486;--no:#f0847c;--fl:#e0b04f;--sel:#26382f}}
:root[data-theme="dark"]{--bg:#161715;--fg:#ecebe5;--mu:#a09f96;--cd:#212220;--bd:#3a3b37;--ac:#5fb59f;--ok:#58c486;--no:#f0847c;--fl:#e0b04f;--sel:#26382f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;line-height:1.25;margin:8px 0}h2{font-size:17px;margin:18px 0 8px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--cd);color:var(--fg);border-radius:10px;padding:10px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;line-height:1.45}
.opt.s{border-color:var(--ac);background:var(--sel)}
.opt.ok{border-color:var(--ok);background:var(--sel)}.opt.no{border-color:var(--no)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center;z-index:5}
.tm{font-weight:700;font-variant-numeric:tabular-nums}.tm.lo{color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>button{flex:1}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.g button{padding:8px 0;text-align:center}.g .a{background:var(--sel);border-color:var(--ac)}.g .f{border-color:var(--fl);box-shadow:inset 0 0 0 2px var(--fl)}.g .c{outline:2px solid var(--fg)}
.sc{font-size:44px;font-weight:700;color:var(--ac);line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.pb{background:var(--sel);border-radius:8px;padding:10px;margin-top:8px;font-size:15px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
</style></head><body><div class="w" id="app"></div>
<script>
const D=[{"id": 1, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Rapor Pendidikan menunjukkan indikator literasi kelas 5 turun 12 poin dibanding tahun lalu. Sekolah sudah menjalankan program literasi pagi setiap tahun. Saat rapat penyusunan RKT, sebagian guru meminta program itu dilanjutkan tanpa perubahan. Tindakan Kepala Sekolah yang paling tepat adalah ...", "o": ["Menambah durasi literasi pagi karena programnya sudah berjalan", "Memimpin analisis akar masalah bersama guru dengan data rapor dan data pembelajaran, lalu menetapkan prioritas benahi dalam RKT", "Meminta guru kelas 5 menulis laporan penyebab penurunan secara tertulis", "Menunggu hasil Rapor Pendidikan tahun berikutnya untuk memastikan tren"], "k": 1, "p": "PBD dimulai dari identifikasi, refleksi, dan pembenahan. Akar masalah dicari bersama, lalu hasilnya menjadi prioritas perencanaan. Opsi A melanjutkan program tanpa bukti efektivitas. Opsi C membebankan kesalahan pada satu kelompok. Opsi D menunda tindakan."}, {"id": 2, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Koordinator ekstrakurikuler mengusulkan seminar motivasi siswa dengan dana BOS. Kegiatan itu tidak berkaitan dengan prioritas hasil Rapor Pendidikan dalam draf RKAS. Kepala Sekolah sebaiknya ...", "o": ["Menyetujui karena usulan datang dari guru yang aktif", "Menolak langsung agar tidak mengganggu RKAS", "Meminta justifikasi keterkaitan usulan dengan prioritas PBD dan kesesuaiannya dengan juknis BOS, lalu memutuskan bersama tim", "Menyetujui dengan memotong anggaran pos pembelajaran"], "k": 2, "p": "Setiap belanja harus terhubung dengan prioritas hasil analisis data dan sah menurut juknis. Keputusan diambil lewat mekanisme tim, bukan atas dasar sikap pribadi. Opsi D mengorbankan pos yang justru menjadi prioritas."}, {"id": 3, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Menjelang akhir tahun anggaran, komite sekolah meminta sisa dana BOS dipakai membeli seragam gratis untuk seluruh siswa. Komponen itu tidak diperbolehkan dalam juknis BOS yang berlaku. Respons terbaik Kepala Sekolah adalah ...", "o": ["Menjelaskan batasan juknis kepada komite, lalu bersama-sama mencari sumber lain yang sah dan tidak mengikat untuk kebutuhan tersebut", "Menyetujui dan mencatatnya sebagai belanja alat pembelajaran", "Menyetujui karena komite mewakili orang tua", "Menolak tanpa penjelasan agar tidak terjadi perdebatan"], "k": 0, "p": "Integritas pengelolaan dana menuntut kepatuhan pada juknis, disertai komunikasi dan solusi alternatif. Opsi B adalah manipulasi pencatatan. Opsi D menutup dialog dengan mitra."}, {"id": 4, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Atap tiga ruang kelas bocor, perpustakaan kekurangan rak, dan laboratorium komputer kekurangan unit. Dana sarpras tahun ini hanya cukup untuk satu kebutuhan. Kepala Sekolah harus ...", "o": ["Mengerjakan yang paling murah agar cepat selesai", "Membagi dana rata ke ketiganya agar adil", "Menunggu bantuan pemerintah untuk seluruh kebutuhan", "Menyusun skala prioritas dari data inventaris, risiko keselamatan, dan dampak terhadap pembelajaran, lalu mengajukan sisanya ke dinas"], "k": 3, "p": "Prioritas sarpras ditentukan oleh risiko dan dampak pada layanan belajar. Pembagian rata membuat ketiganya tidak tuntas. Kebocoran atap menyangkut keselamatan dan lazimnya diutamakan."}, {"id": 5, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Hasil pengecekan menunjukkan jumlah meja dan kursi di buku inventaris berbeda dengan kondisi fisik. Langkah pertama yang tepat adalah ...", "o": ["Membentuk tim stock opname, mencocokkan data dengan fisik, dan menyusun berita acara rekonsiliasi", "Mengubah angka di buku agar sama dengan fisik tanpa catatan", "Memanggil petugas inventaris dan menyalahkannya", "Menunggu pemeriksaan dari inspektorat"], "k": 0, "p": "Selisih aset diselesaikan lewat verifikasi terdokumentasi. Opsi B menghilangkan jejak audit. Opsi C dan D tidak menyelesaikan masalah."}, {"id": 6, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Bendahara berencana membeli komputer dari toko milik adik Wakil Kepala Sekolah. Tidak ada penawaran pembanding. Kepala Sekolah harus ...", "o": ["Membiarkan karena harganya tampak wajar", "Menyerahkan keputusan sepenuhnya kepada Wakil Kepala Sekolah", "Meminta minimal tiga penawaran pembanding, mengungkap hubungan kepentingan, dan mendokumentasikan pemilihan penyedia secara terbuka", "Membatalkan pembelian untuk menghindari masalah"], "k": 2, "p": "Konflik kepentingan dikelola lewat keterbukaan dan perbandingan harga. Pembatalan total (D) merugikan sekolah bila penawaran itu memang terbaik."}, {"id": 7, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Beberapa orang tua bertanya ke mana dana BOS digunakan. Tindakan yang mencerminkan akuntabilitas adalah ...", "o": ["Menjawab bahwa penggunaan sudah dilaporkan ke dinas", "Menyampaikan ringkasan RKAS dan realisasinya melalui papan informasi dan rapat komite, serta membuka ruang tanya jawab", "Meminta orang tua menemui bendahara", "Menunggu orang tua mengajukan permintaan tertulis"], "k": 1, "p": "Transparansi proaktif membangun kepercayaan. Opsi A, C, dan D bersifat defensif atau menunda."}, {"id": 8, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Program ekstrakurikuler sudah berjalan dua tahun, tetapi tidak ada indikator capaian dan tidak pernah dievaluasi. Langkah perbaikan yang tepat adalah ...", "o": ["Menambah jumlah ekstrakurikuler", "Mengganti pembina setiap semester", "Mengevaluasi berdasarkan jumlah peserta", "Menetapkan indikator dan target capaian yang terukur, lalu mengevaluasinya secara berkala dan menjadikan hasilnya dasar perencanaan berikutnya"], "k": 3, "p": "Siklus perencanaan, pelaksanaan, evaluasi, dan tindak lanjut membutuhkan indikator terukur. Jumlah peserta tidak menggambarkan mutu."}, {"id": 9, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Tenggat pelaporan BOSP tinggal tiga hari, sementara operator terlambat memperbarui data peserta didik di Dapodik. Kepala Sekolah sebaiknya ...", "o": ["Menyelesaikan laporan dengan data yang ada dulu", "Memprioritaskan validasi Dapodik karena menjadi basis laporan, mendampingi operator, dan membagi tugas agar tepat waktu", "Menegur operator di depan rekan kerja", "Meminta perpanjangan waktu tanpa berusaha menyelesaikan"], "k": 1, "p": "Data pokok yang valid menentukan kualitas laporan dan alokasi. Pendampingan menyelesaikan akar keterlambatan. Teguran terbuka merusak iklim kerja."}, {"id": 10, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Dapodik masih mencatat seorang guru yang sudah pindah tugas dua bulan lalu. Tindakan yang tepat adalah ...", "o": ["Segera memperbaiki data melalui prosedur verifikasi karena berdampak pada pemetaan kebutuhan guru dan hak tunjangan", "Membiarkan karena guru tersebut masih sering membantu sekolah", "Menunggu dinas memperbaiki sendiri", "Mengubah data setelah akhir semester"], "k": 0, "p": "Kebenaran data adalah tanggung jawab satuan pendidikan. Data keliru berdampak pada kebijakan dan hak orang lain."}, {"id": 11, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Dua guru mata pelajaran IPA akan pensiun semester depan dan tidak ada penggantinya. Kepala Sekolah harus ...", "o": ["Menunjuk guru mata pelajaran lain secara bergiliran", "Meminta siswa belajar mandiri", "Memetakan kebutuhan guru dari data beban mengajar, mengusulkan formasi ke dinas, dan menyiapkan solusi sementara melalui kolaborasi lintas sekolah atau guru berkompetensi sesuai", "Menghapus mata pelajaran dari jadwal"], "k": 2, "p": "Kekurangan guru dijawab dengan data, usulan resmi, dan solusi sementara yang menjaga mutu layanan siswa."}, {"id": 12, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Dinas mengundang sekolah mengikuti lomba dengan biaya yang belum ada di RKAS. Langkah yang paling tepat adalah ...", "o": ["Menggunakan dana pos pemeliharaan tanpa pencatatan", "Menolak karena tidak dianggarkan", "Meminta orang tua menanggung biaya", "Menilai manfaat bagi siswa, lalu bila selaras dengan prioritas dan juknis, memproses perubahan RKAS melalui mekanisme yang berlaku"], "k": 3, "p": "Kegiatan baru dimasukkan lewat revisi RKAS yang sah, bukan menggeser dana secara diam-diam atau membebankannya pada orang tua."}, {"id": 13, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Hasil ANBK menunjukkan numerasi siswa berada di bawah kompetensi minimum. Wakil Kepala Sekolah bidang kurikulum mengusulkan membeli paket bimbingan dari lembaga luar. Kepala Sekolah sebaiknya ...", "o": ["Menyetujui paket bimbingan karena lembaga luar lebih berpengalaman", "Menambah latihan soal numerasi di semua mapel tanpa analisis", "Memfasilitasi guru menganalisis pola kesalahan siswa pada soal ANBK, lalu merancang pembenahan pembelajaran di kelas sebelum memutuskan kebutuhan bimbingan tambahan", "Meminta guru matematika menaikkan hasil dalam satu semester"], "k": 2, "p": "Hasil asesmen dipakai untuk menemukan akar masalah pembelajaran. Membeli solusi sebelum diagnosis berisiko boros dan tidak tepat sasaran."}, {"id": 14, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Guru senior mengusulkan RKJM empat tahun disalin saja dari dokumen sebelumnya agar cepat. Kepala Sekolah sebaiknya ...", "o": ["Menerima usul itu dan hanya mengganti tahun", "Menugaskan satu wakil kepala sekolah menyusun sendiri agar efisien", "Menunda RKJM sampai ada petunjuk tambahan dari dinas", "Menyusun RKJM dari hasil evaluasi diri dan Rapor Pendidikan, melibatkan guru, komite, dan pemangku kepentingan dalam menetapkan visi, target, dan program"], "k": 3, "p": "RKJM harus kontekstual dan berbasis data serta disusun partisipatif. Menyalin dokumen lama memutus hubungan perencanaan dengan kondisi sekolah."}, {"id": 15, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Bendahara tidak memungut dan menyetor pajak atas sejumlah belanja BOS karena menganggapnya merepotkan. Kepala Sekolah harus ...", "o": ["Membiarkan karena nilai belanjanya kecil", "Mengalihkan kewajiban itu kepada penyedia barang", "Menginstruksikan bendahara memenuhi kewajiban perpajakan sesuai ketentuan, memperbaiki pencatatan, dan meminta pendampingan teknis bila diperlukan", "Menunggu temuan pemeriksa baru memperbaikinya"], "k": 2, "p": "Kepatuhan pajak adalah bagian akuntabilitas keuangan. Pembiaran menumpuk risiko temuan dan pelanggaran."}, {"id": 16, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Sebuah kegiatan sudah terlaksana, tetapi sebagian bukti belanjanya hilang. Bendahara mengusulkan membuat kuitansi baru dengan tanggal yang disesuaikan. Respons yang benar adalah ...", "o": ["Menyetujui asal nilainya sesuai kegiatan", "Membuang seluruh berkas agar tidak menimbulkan pertanyaan", "Meminta guru pelaksana menanggung biayanya dari uang pribadi", "Menolak pembuatan bukti fiktif, mencari duplikat dari penyedia, membuat berita acara bila bukti tidak dapat dipulihkan, dan memperbaiki sistem pengarsipan"], "k": 3, "p": "Integritas melarang pemalsuan dokumen. Penyelesaian harus jujur, terdokumentasi, dan disertai perbaikan sistem."}, {"id": 17, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Wakil Kepala Sekolah bidang sarpras mengusulkan membeli 10 proyektor baru. Pemeriksaan awal menunjukkan proyektor lama di kelas jarang dipakai. Kepala Sekolah sebaiknya ...", "o": ["Menyetujui karena teknologi mendukung pembelajaran", "Menolak semua usulan sarpras tahun ini", "Mengkaji tingkat pemanfaatan dan penyebab rendahnya penggunaan, lalu memutuskan pembelian setelah kebutuhan nyata dan kesiapan guru jelas", "Membeli sebagian agar usulan tidak sia-sia"], "k": 2, "p": "Pengadaan harus berbasis kebutuhan dan pemanfaatan. Data penggunaan menunjukkan masalahnya mungkin pada kompetensi atau jadwal, bukan jumlah alat."}, {"id": 18, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Hasil evaluasi diri sekolah menunjukkan hampir semua indikator bernilai tinggi, tetapi Rapor Pendidikan menunjukkan banyak indikator merah. Kepala Sekolah menduga pengisian dilakukan demi citra. Tindakan terbaik adalah ...", "o": ["Menerima hasil karena sudah diisi tim", "Menyalahkan tim penyusun di depan guru", "Mengubah skor secara langsung agar sesuai rapor", "Menegaskan evaluasi diri sebagai alat refleksi, meminta pengisian ulang berbasis bukti, dan memverifikasi dengan data serta dokumen pendukung"], "k": 3, "p": "Perencanaan yang baik menuntut data jujur dan terverifikasi. Penilaian diri tanpa bukti menghasilkan program yang salah arah."}, {"id": 19, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Seorang guru honorer meminta honor dibayar dari dana BOS, padahal data pokoknya belum tercatat di Dapodik. Kepala Sekolah sebaiknya ...", "o": ["Membayar dulu dan mengurus data belakangan", "Menjelaskan persyaratan juknis, lalu membantu menyelesaikan pendataan guru tersebut agar haknya dapat diproses secara sah", "Menolak tanpa membantu proses pendataan", "Membayar dari dana komite tanpa pencatatan"], "k": 1, "p": "Pembayaran honor harus memenuhi syarat juknis. Kepala Sekolah berkewajiban membantu pemenuhan syarat, bukan melanggar atau mengabaikan."}, {"id": 20, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Siswa mengeluhkan toilet yang rusak dan kotor, dan data survei iklim sekolah mendukung keluhan itu. Dana terbatas. Langkah perencanaan yang tepat adalah ...", "o": ["Menunggu dana tersedia tanpa rencana", "Menegur siswa agar menjaga kebersihan", "Memperbaiki seluruh toilet sekaligus dengan dana pos lain", "Memasukkan perbaikan toilet ke RKT dan RKAS berdasarkan data, menyusun tahapan pengerjaan dan sumber dana, serta melibatkan komite untuk dukungan yang sah"], "k": 3, "p": "Keluhan yang didukung data menjadi dasar prioritas. Tahapan dan sumber dana yang jelas membuat perbaikan realistis."}, {"id": 21, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Kepala Sekolah yang baru bertugas menemukan RKAS peninggalan pimpinan sebelumnya tidak sesuai kebutuhan. Langkah yang tepat adalah ...", "o": ["Membatalkan seluruh RKAS dan menyusun sendiri", "Meninjau RKAS bersama tim dengan data terbaru, lalu merevisinya melalui mekanisme yang berlaku", "Menjalankan RKAS apa adanya agar tidak terjadi konflik", "Mengabaikan RKAS dan membelanjakan sesuai kebutuhan mendesak"], "k": 1, "p": "Perubahan perencanaan dilakukan melalui kajian dan prosedur revisi, bukan keputusan sepihak yang melanggar tata kelola."}, {"id": 22, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Dalam rapat evaluasi, ditemukan banyak program tidak tuntas karena tidak jelas siapa yang bertanggung jawab. Perbaikan yang paling tepat adalah ...", "o": ["Mengurangi jumlah program secara acak", "Menugaskan semua program kepada wakil kepala sekolah", "Menunda evaluasi sampai akhir tahun", "Menetapkan penanggung jawab, indikator, jadwal, dan mekanisme monitoring untuk setiap program dalam RKT"], "k": 3, "p": "Program berjalan bila peran, ukuran keberhasilan, dan pemantauannya jelas."}, {"id": 23, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Seorang perwakilan penerbit menawarkan komisi kepada guru yang mengusulkan buku terbitannya untuk dibeli sekolah. Sikap Kepala Sekolah adalah ...", "o": ["Menerima komisi lalu menyerahkannya ke komite", "Membiarkan karena komisi diberikan kepada guru, bukan sekolah", "Menolak komisi, menegaskan larangan gratifikasi, dan memilih buku melalui telaah tim berdasarkan mutu, kesesuaian kurikulum, dan harga", "Memilih buku dari penerbit itu agar hubungan baik terjaga"], "k": 2, "p": "Gratifikasi mengganggu objektivitas pengadaan. Seleksi harus berbasis mutu dan transparan."}, {"id": 24, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Terjadi kebakaran kecil di kantin sekolah dan sekolah tidak memiliki APAR maupun jalur evakuasi yang jelas. Langkah perencanaan yang tepat adalah ...", "o": ["Melarang kantin beroperasi selamanya", "Menunggu inspeksi dinas", "Menyusun rencana K3 dan manajemen risiko, mengadakan APAR dan rambu evakuasi, melatih warga sekolah, dan menganggarkannya dalam RKAS", "Membeli APAR saja tanpa pelatihan"], "k": 2, "p": "Keselamatan menuntut sistem: sarana, prosedur, dan latihan. Anggaran harus masuk perencanaan."}, {"id": 25, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Data menunjukkan banyak siswa kelas 8 tidak naik kelas, dengan tingkat ketidakhadiran tinggi. Tindakan Kepala Sekolah yang paling tepat adalah ...", "o": ["Memberi sanksi tegas kepada siswa yang sering absen", "Menaikkan siswa agar angka tidak naik kelas rendah", "Memetakan penyebab ketidakhadiran per siswa, melibatkan wali kelas, guru BK, dan orang tua, lalu menyusun program pendampingan", "Meminta wali kelas membuat daftar absen saja"], "k": 2, "p": "Akar masalah kehadiran berbeda tiap anak. Pendekatan berbasis data dan kolaboratif lebih efektif daripada sanksi atau manipulasi angka."}, {"id": 26, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Sekolah memperoleh dana hibah pembangunan ruang praktik dengan pola swakelola. Langkah awal Kepala Sekolah yang benar adalah ...", "o": ["Menyerahkan pengelolaan sepenuhnya kepada kontraktor pilihan pribadi", "Membentuk tim pelaksana, menyusun RAB sesuai juknis hibah, melibatkan komite, dan menyiapkan pelaporan terbuka", "Memulai pembangunan dulu dan menyusun laporan di akhir", "Merahasiakan nilai hibah agar tidak menimbulkan tuntutan"], "k": 1, "p": "Dana hibah menuntut tata kelola yang tertib, partisipatif, dan akuntabel sejak perencanaan."}, {"id": 27, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Bendahara meminta Kepala Sekolah menandatangani sejumlah kuitansi kosong agar pencairan cepat. Respons yang tepat adalah ...", "o": ["Menolak dan meminta kuitansi terisi lengkap beserta bukti pendukung sebelum ditandatangani", "Menandatangani karena percaya pada bendahara", "Menandatangani sebagian dan mengisi sisanya nanti", "Mendelegasikan tanda tangan kepada wakil kepala sekolah"], "k": 0, "p": "Tanda tangan pada dokumen kosong membuka ruang penyalahgunaan dan melanggar prinsip akuntabilitas."}, {"id": 28, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Jumlah rombongan belajar bertambah, tetapi ruang kelas tidak mencukupi. Kepala Sekolah sebaiknya ...", "o": ["Menghitung proyeksi peserta didik, mengajukan kebutuhan ke dinas dengan data, dan menata pemanfaatan ruang sementara tanpa menurunkan mutu pembelajaran", "Menolak penerimaan siswa baru tanpa koordinasi", "Memadatkan kelas melebihi ketentuan", "Meliburkan sebagian kelas bergantian tanpa jadwal pembelajaran"], "k": 0, "p": "Solusi jangka pendek dan usulan jangka panjang berbasis data menjaga hak belajar siswa."}, {"id": 29, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Hasil identifikasi menunjukkan sebagian besar guru lemah dalam merancang asesmen. Dalam RKAS, tindakan paling tepat adalah ...", "o": ["Mengalokasikan dana pengembangan kompetensi guru yang sesuai juknis untuk pelatihan dan komunitas belajar tentang asesmen", "Menggunakan dana itu untuk membeli perangkat ujian baru", "Menurunkan tuntutan asesmen dalam kurikulum", "Menunggu pelatihan dari pemerintah tanpa tindakan sekolah"], "k": 0, "p": "Kebutuhan hasil identifikasi harus tercermin dalam anggaran agar pembenahan terjadi."}, {"id": 30, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Sebulan sebelum visitasi akreditasi, arsip dokumen sekolah belum tertata dan beberapa bukti belum ada. Langkah yang benar adalah ...", "o": ["Menata arsip menurut standar, membagi tanggung jawab, dan melengkapi bukti yang benar-benar tersedia tanpa membuat dokumen mundur", "Membuat dokumen baru dengan tanggal mundur", "Meminta sekolah lain meminjamkan dokumen untuk disalin", "Menyembunyikan komponen yang belum lengkap"], "k": 0, "p": "Akreditasi menilai kondisi nyata. Manipulasi bukti melanggar integritas dan merugikan sekolah."}, {"id": 31, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Realisasi anggaran triwulan pertama pada pos pembelajaran sangat rendah. Kepala Sekolah sebaiknya ...", "o": ["Menghabiskan anggaran di akhir tahun agar tidak hangus", "Menelusuri hambatan pelaksanaan bersama penanggung jawab, menyesuaikan jadwal, dan merevisi rencana bila diperlukan", "Memindahkan sisa dana ke pos lain secara bebas", "Menyalahkan bendahara atas rendahnya serapan"], "k": 1, "p": "Serapan rendah adalah sinyal masalah pelaksanaan. Penyelesaiannya lewat penelusuran dan penyesuaian, bukan belanja asal habis."}, {"id": 32, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Dalam menyusun target pembenahan, seorang wakil kepala sekolah mengusulkan semua indikator merah naik 30 persen dalam satu tahun. Tanggapan terbaik adalah ...", "o": ["Menyetujui agar sekolah tampak ambisius", "Menolak penetapan target apa pun", "Menetapkan target bertahap yang realistis berdasarkan kondisi awal, kapasitas sekolah, dan sumber daya, lalu memonitornya", "Menyalin target dari sekolah lain"], "k": 2, "p": "Target harus menantang namun dapat dicapai agar menjadi pemandu kerja yang kredibel."}, {"id": 33, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Seorang guru melaporkan dugaan penggelembungan harga pengadaan alat kebersihan. Kepala Sekolah sebaiknya ...", "o": ["Menegur pelapor karena mencemarkan nama baik", "Memverifikasi dokumen dan harga pembanding secara objektif, melindungi pelapor, dan melaporkan ke pihak berwenang bila terbukti", "Mengabaikan karena nilainya kecil", "Mengumumkan dugaan itu di grup guru"], "k": 1, "p": "Dugaan harus ditangani dengan verifikasi, perlindungan pelapor, dan prosedur yang sah."}, {"id": 34, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Sekolah memiliki lahan kosong di belakang gedung dan komite mengusulkan menyewakannya untuk usaha pribadi. Kepala Sekolah harus ...", "o": ["Menyetujui penyewaan demi pemasukan sekolah", "Memastikan status aset dan perizinan dengan pemilik aset, lalu merencanakan pemanfaatan sesuai ketentuan dan kebutuhan belajar bersama komite", "Membiarkan lahan kosong tanpa rencana", "Memberikan lahan kepada pihak yang berjasa"], "k": 1, "p": "Aset negara hanya dimanfaatkan sesuai aturan. Status dan izin harus jelas sebelum pemanfaatan apa pun."}, {"id": 35, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Kurikulum satuan pendidikan disusun dengan menyalin dokumen dari sekolah lain. Perbaikan yang tepat adalah ...", "o": ["Mempertahankan dokumen karena sudah disahkan", "Menyusun ulang berdasarkan analisis konteks, karakteristik peserta didik, dan sumber daya sekolah dengan melibatkan guru dan pemangku kepentingan", "Mengganti nama sekolah saja", "Menunggu pedoman baru tanpa tindakan"], "k": 1, "p": "Kurikulum harus kontekstual. Dokumen salinan tidak mencerminkan kebutuhan sekolah."}, {"id": 36, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Kepala Sekolah ingin seluruh guru memakai platform pembelajaran digital, tetapi jaringan sekolah terbatas dan kemampuan guru beragam. Langkah awal terbaik adalah ...", "o": ["Mewajibkan semua guru segera menggunakannya", "Memetakan kesiapan infrastruktur dan kompetensi, lalu memulai dengan uji coba terbatas yang sesuai kondisi", "Membatalkan inisiatif digital", "Membeli perangkat mahal dahulu"], "k": 1, "p": "Inovasi diterapkan bertahap sesuai kesiapan agar berkelanjutan dan tidak membebani."}, {"id": 37, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Dua kegiatan besar berbenturan dengan jadwal ujian sekolah dan penyelenggara masing-masing merasa kegiatannya penting. Kepala Sekolah sebaiknya ...", "o": ["Memenangkan pihak yang paling vokal", "Menggabungkan semua kegiatan di hari yang sama", "Menyusun kalender akademik terpadu bersama tim, menetapkan prioritas berdasarkan dampak belajar, dan mengomunikasikannya kepada semua pihak", "Membatalkan salah satu tanpa penjelasan"], "k": 2, "p": "Koordinasi terpadu dan komunikasi mencegah konflik jadwal dan melindungi waktu belajar."}, {"id": 38, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Tahun lalu sekolah mendapat temuan pemeriksa soal laporan BOS. Agar tidak terulang, tindakan paling efektif adalah ...", "o": ["Membentuk mekanisme monitoring internal berkala, menindaklanjuti temuan, dan memperbaiki prosedur yang menjadi sumber kesalahan", "Mengganti bendahara", "Menyembunyikan temuan dari guru", "Menunggu pemeriksaan berikutnya"], "k": 0, "p": "Pengendalian internal yang berkelanjutan mencegah kesalahan berulang."}, {"id": 39, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Sebuah perusahaan aplikasi meminta data lengkap peserta didik untuk uji coba produk tanpa perjanjian tertulis. Respons yang tepat adalah ...", "o": ["Memberikan data karena aplikasinya gratis", "Memberikan data sebagian tanpa pencatatan", "Menyerahkan keputusan kepada operator", "Menolak sampai ada perjanjian dan dasar hukum yang jelas, serta melindungi data pribadi sesuai ketentuan"], "k": 3, "p": "Data pribadi anak wajib dilindungi. Pemberian data harus berdasar aturan dan persetujuan."}, {"id": 40, "b": "Kompetensi manajerial dan perencanaan berbasis data", "n": "Urutan siklus perencanaan berbasis data yang benar adalah ...", "o": ["Susun program, kumpulkan data, anggarkan, laksanakan", "Anggarkan, laksanakan, laporkan, lalu cari masalah", "Evaluasi, kemudian tentukan visi tanpa data", "Identifikasi masalah dari data, refleksi akar masalah, benahi melalui program prioritas, lalu evaluasi dan tindak lanjut"], "k": 3, "p": "PBD mengikuti alur identifikasi, refleksi, pembenahan, dan evaluasi berkelanjutan."}, {"id": 41, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Seorang guru menolak dikunjungi kelasnya karena merasa dinilai. Kepala Sekolah sebaiknya ...", "o": ["Mengajak guru berdialog, menjelaskan supervisi sebagai pendampingan, dan menyepakati fokus observasi yang diinginkan guru sebelum kunjungan", "Tetap masuk kelas tanpa pemberitahuan agar melihat kondisi asli", "Mencatat penolakan itu sebagai pelanggaran disiplin", "Mengganti supervisi dengan pemeriksaan kelengkapan administrasi"], "k": 0, "p": "Supervisi berbasis coaching diawali pra-observasi yang membangun kepercayaan dan kesepakatan fokus."}, {"id": 42, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Setelah observasi, Kepala Sekolah melihat guru terlalu banyak ceramah dan siswa pasif. Cara memberi umpan balik terbaik adalah ...", "o": ["Mengajukan pertanyaan reflektif agar guru sendiri menyadari pola pembelajaran, lalu menyusun rencana perbaikan bersama", "Menyampaikan bahwa metode guru ketinggalan zaman", "Memberi daftar metode yang harus dipakai mulai besok", "Menyampaikan umpan balik lewat guru lain"], "k": 0, "p": "Coaching memakai pertanyaan reflektif agar guru memiliki perubahan itu dan termotivasi menjalankannya."}, {"id": 43, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Banyak guru menyusun modul ajar hanya untuk kelengkapan administrasi dan tidak menggunakannya di kelas. Tindakan Kepala Sekolah yang tepat adalah ...", "o": ["Menambah jumlah dokumen yang harus dikumpulkan", "Membiarkan karena administrasi tetap lengkap", "Memberi sanksi kepada guru yang tidak memakai modul", "Mengarahkan supervisi pada kesesuaian perencanaan dengan praktik di kelas, dan menyederhanakan format administrasi yang tidak bermanfaat"], "k": 3, "p": "Tujuan perencanaan adalah memperbaiki pembelajaran. Fokus supervisi harus pada praktik, bukan tumpukan dokumen."}, {"id": 44, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Guru senior menolak pembelajaran berdiferensiasi karena merasa metodenya selama ini berhasil. Kepala Sekolah sebaiknya ...", "o": ["Mengajak guru melihat data kebutuhan belajar siswa dan praktik baik rekan, lalu mendampinginya mencoba satu langkah kecil", "Meminta guru pensiun dini", "Memaksa guru mengikuti seperti guru lain", "Mengabaikan karena guru itu sudah senior"], "k": 0, "p": "Perubahan paling efektif bila dimulai dari data, contoh nyata, dan langkah kecil yang didampingi."}, {"id": 45, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Kepala Sekolah ingin membentuk komunitas belajar guru. Dasar pembentukan yang paling tepat adalah ...", "o": ["Pembagian kelompok berdasarkan kedekatan pertemanan", "Penugasan dari dinas tanpa penyesuaian", "Kebutuhan belajar yang dipetakan dari hasil refleksi dan supervisi, dengan agenda dan produk yang jelas", "Pertemuan rutin tanpa agenda"], "k": 2, "p": "Komunitas belajar efektif bila berpijak pada kebutuhan nyata dan menghasilkan perbaikan praktik."}, {"id": 46, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Supervisi di sekolah selama ini hanya berupa pengecekan kehadiran dan perangkat. Perubahan yang paling tepat adalah ...", "o": ["Menambah daftar periksa administrasi", "Menghentikan supervisi karena menyita waktu", "Menyerahkan supervisi sepenuhnya kepada pengawas", "Menggeser supervisi menjadi siklus pra-observasi, observasi, refleksi, dan tindak lanjut yang berfokus pada pembelajaran murid"], "k": 3, "p": "Supervisi akademik bertujuan meningkatkan kualitas pembelajaran melalui siklus pendampingan."}, {"id": 47, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Guru baru kesulitan mengelola kelas dan beberapa siswa mulai mengabaikannya. Dukungan paling tepat adalah ...", "o": ["Menugaskan guru berpengalaman sebagai mentor, menyediakan kesempatan observasi sejawat, dan melakukan pendampingan berkala", "Menyerahkan kelas itu kepada guru lain", "Menegur guru karena tidak berwibawa", "Menunggu guru belajar sendiri"], "k": 0, "p": "Mentoring dan observasi sejawat mempercepat pertumbuhan guru baru tanpa merendahkannya."}, {"id": 48, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Seorang guru memberi nilai akhir tanpa asesmen formatif dan tanpa umpan balik kepada siswa. Langkah pembinaan yang tepat adalah ...", "o": ["Menganulir seluruh nilai siswa", "Meminta guru menambah ujian", "Berdiskusi tentang fungsi asesmen formatif, mendampingi guru merancangnya, dan memantau penerapannya", "Membiarkan karena nilai sudah diinput"], "k": 2, "p": "Asesmen formatif memberi informasi untuk memperbaiki belajar. Pembinaan berbentuk pendampingan, bukan penghukuman."}, {"id": 49, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Seorang guru kewalahan menghadapi siswa berkebutuhan khusus di kelasnya. Kepala Sekolah sebaiknya ...", "o": ["Memindahkan siswa ke kelas lain tanpa persetujuan orang tua", "Memfasilitasi kolaborasi guru dengan guru pendamping, orang tua, dan ahli, serta pelatihan pembelajaran inklusif", "Meminta orang tua memindahkan anak ke sekolah lain", "Meminta guru menangani sendiri"], "k": 1, "p": "Sekolah wajib memberi layanan yang ramah bagi semua anak melalui kolaborasi dan penguatan kompetensi guru."}, {"id": 50, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Hasil supervisi memperlihatkan sebagian besar guru kesulitan merancang pertanyaan berpikir tingkat tinggi. Tindak lanjut terbaik adalah ...", "o": ["Memberi teguran kepada seluruh guru", "Mengirim satu guru saja tanpa diseminasi", "Menunda sampai tahun depan", "Merancang kegiatan pengembangan kolektif seperti lokakarya internal atau komunitas belajar tentang topik itu"], "k": 3, "p": "Pola kesulitan yang sama membutuhkan pengembangan bersama, bukan penanganan individual yang terpisah."}, {"id": 51, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Seorang guru langsung membantah setiap masukan Kepala Sekolah setelah observasi. Pendekatan terbaik adalah ...", "o": ["Mendengarkan lebih dulu, menyampaikan temuan berdasarkan data observasi, dan mengajak guru merumuskan solusi", "Berdebat sampai guru mengaku salah", "Menghentikan umpan balik", "Melaporkan guru ke pengawas"], "k": 0, "p": "Keterbukaan dan data objektif menurunkan sikap defensif dan membangun dialog."}, {"id": 52, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Seorang guru kreatif memakai banyak kegiatan menarik, tetapi tidak jelas kaitannya dengan tujuan pembelajaran. Kepala Sekolah sebaiknya ...", "o": ["Melarang kegiatan kreatif tersebut", "Mengapresiasi kreativitasnya, lalu membantu menyelaraskan kegiatan dengan tujuan dan asesmen", "Membiarkan karena siswa senang", "Meminta guru memakai metode ceramah"], "k": 1, "p": "Kreativitas perlu diarahkan pada capaian belajar yang jelas."}, {"id": 53, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Sekolah mulai menerapkan pembelajaran mendalam, tetapi sebagian guru hanya mengganti istilah di dokumen. Tindakan yang tepat adalah ...", "o": ["Menilai keberhasilan dari kelengkapan dokumen", "Menghentikan penerapan", "Mengamati praktik di kelas, memberi umpan balik pada kualitas pengalaman belajar siswa, dan menyediakan pendampingan serta contoh praktik baik", "Menyalahkan guru yang belum paham"], "k": 2, "p": "Perubahan sejati terlihat pada pengalaman belajar murid, sehingga supervisi harus menilai praktik."}, {"id": 54, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Seorang guru sangat rajin dan administrasinya lengkap, tetapi hasil belajar siswanya rendah. Pendekatan yang tepat adalah ...", "o": ["Memberi penghargaan karena rajin", "Menyimpulkan siswa yang bermasalah", "Menurunkan standar penilaian", "Menganalisis proses pembelajaran dan asesmen bersama guru untuk menemukan penyebab, bukan menilai dari kerajinan saja"], "k": 3, "p": "Kualitas diukur dari dampak pada belajar. Analisis proses membantu menemukan titik perbaikan."}, {"id": 55, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Seorang guru memakai AI untuk menyusun soal ulangan tanpa memeriksa isinya, dan terdapat kesalahan konsep. Respons Kepala Sekolah yang tepat adalah ...", "o": ["Melarang seluruh penggunaan teknologi AI", "Mengabaikan karena soal sudah dipakai", "Mempermalukan guru di rapat", "Mengajak guru mengevaluasi hasil AI secara kritis, menyepakati pedoman penggunaan yang bertanggung jawab, dan melatih kemampuan verifikasi"], "k": 3, "p": "Teknologi dapat membantu bila ada pengawasan mutu dan etika. Pelarangan total atau pembiaran sama-sama kurang tepat."}, {"id": 56, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Dua supervisor menilai guru yang sama dengan hasil sangat berbeda. Perbaikan paling tepat adalah ...", "o": ["Menyusun rubrik dan indikator observasi yang jelas serta menyamakan pemahaman supervisor", "Merata-ratakan nilai kedua supervisor", "Memilih penilaian yang lebih tinggi", "Mengganti salah satu supervisor"], "k": 0, "p": "Objektivitas supervisi bergantung pada instrumen dan kalibrasi penilai."}, {"id": 57, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Beberapa guru sudah mengikuti pelatihan mandiri di platform pengembangan guru, tetapi tidak menerapkannya. Kepala Sekolah sebaiknya ...", "o": ["Menganggap pelatihan sudah cukup", "Memfasilitasi berbagi praktik, menetapkan rencana aksi penerapan, dan memantau hasilnya dalam komunitas belajar", "Menambah pelatihan baru", "Memberi sanksi karena tidak menerapkan"], "k": 1, "p": "Pelatihan bernilai bila diterapkan. Rencana aksi dan pendampingan menjembatani teori dan praktik."}, {"id": 58, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Seorang guru berprestasi menunjukkan pembelajaran yang sangat baik pada supervisi. Tindak lanjut terbaik adalah ...", "o": ["Membiarkan tanpa tindak lanjut", "Menambah beban administrasi", "Memindahkannya ke sekolah lain", "Memberi apresiasi dan mengajaknya menjadi mentor atau pembagi praktik baik bagi rekan"], "k": 3, "p": "Praktik baik perlu diperluas agar manfaatnya dirasakan seluruh sekolah."}, {"id": 59, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Jadwal Kepala Sekolah padat sehingga supervisi sering tertunda. Solusi yang tepat adalah ...", "o": ["Menyusun kalender supervisi, membagi peran dengan wakil kepala sekolah dan guru senior, tetapi tetap memimpin siklus dan tindak lanjutnya", "Menyerahkan seluruh supervisi kepada orang lain", "Menghapus supervisi tahun ini", "Melakukan supervisi hanya saat ada masalah"], "k": 0, "p": "Kepemimpinan pembelajaran dapat dibagi pelaksanaannya, tetapi arah dan tindak lanjut tetap tanggung jawab kepala sekolah."}, {"id": 60, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Banyak siswa tuntas pada asesmen sumatif, sebagian belum. Guru langsung melanjutkan materi. Pembinaan yang tepat adalah ...", "o": ["Mengulang soal yang sama sampai semua tuntas", "Menurunkan nilai kelulusan", "Mendorong guru memberi pengayaan dan remedial berdasarkan hasil asesmen, dengan kegiatan yang berbeda bagi tiap kelompok", "Meminta siswa belajar sendiri"], "k": 2, "p": "Hasil asesmen menjadi dasar tindak lanjut yang berdiferensiasi."}, {"id": 61, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Guru belum memahami kegiatan kokurikuler dan menganggapnya beban tambahan. Langkah Kepala Sekolah yang tepat adalah ...", "o": ["Menugaskan satu guru untuk seluruh kegiatan", "Melaksanakan kegiatan tanpa melibatkan guru", "Menyelenggarakan sesi pemahaman bersama, menyediakan contoh perencanaan, dan mendampingi pelaksanaan tahap awal", "Menunda sampai ada instruksi lanjutan"], "k": 2, "p": "Pemahaman bersama dan pendampingan mengubah persepsi beban menjadi kerja bermakna."}, {"id": 62, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Banyak siswa kelas 1 belum lancar membaca pada pertengahan semester. Tindakan terbaik adalah ...", "o": ["Menahan siswa di kelas 1 tanpa alasan lain", "Memetakan kemampuan membaca tiap siswa, memberi intervensi bertahap, dan berkolaborasi dengan orang tua serta guru", "Menyalahkan guru kelas", "Mengabaikan karena akan membaik sendiri"], "k": 1, "p": "Intervensi dini berbasis pemetaan mencegah ketertinggalan yang makin lebar."}, {"id": 63, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Seorang guru sering terlambat masuk kelas. Pendekatan pembinaan yang tepat adalah ...", "o": ["Memotong gaji tanpa konfirmasi", "Mengumumkan namanya di rapat", "Membiarkan karena guru itu berprestasi", "Mengajak berdialog untuk mengetahui penyebabnya, menyepakati perbaikan, lalu memantau konsistensinya"], "k": 3, "p": "Pembinaan dimulai dari memahami masalah, disertai kesepakatan dan pemantauan, bukan hukuman sepihak."}, {"id": 64, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Kelas dengan jumlah siswa besar membuat guru sulit memberi umpan balik individual. Kepala Sekolah sebaiknya ...", "o": ["Meminta guru mengurangi tugas siswa", "Memindahkan siswa ke kelas lain tanpa kajian", "Menyuruh guru bekerja lebih lama", "Mendampingi guru merancang strategi seperti kelompok belajar, umpan balik sejawat, dan rubrik jelas"], "k": 3, "p": "Strategi pembelajaran yang tepat dapat mengatasi keterbatasan tanpa mengorbankan mutu umpan balik."}, {"id": 65, "b": "Supervisi akademik, pembelajaran, dan pengembangan komunitas belajar", "n": "Sekolah ingin melaksanakan proyek lintas mapel, tetapi guru bekerja sendiri-sendiri. Tindakan yang tepat adalah ...", "o": ["Menugaskan guru tertentu menyusun sendiri", "Membatalkan proyek", "Meminta siswa mengatur sendiri", "Menyediakan waktu perencanaan bersama, menetapkan tujuan proyek, dan membagi peran antarguru"], "k": 3, "p": "Kolaborasi membutuhkan struktur waktu, tujuan, dan peran yang disepakati."}, {"id": 66, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Orang tua siswa menitipkan bingkisan bernilai besar menjelang pengumuman kenaikan kelas anaknya. Sikap Kepala Sekolah adalah ...", "o": ["Menerima lalu membagikannya kepada guru", "Menerima dan menyimpannya sebagai tanda terima kasih", "Menerima secara diam-diam agar hubungan tetap baik", "Menolak dengan sopan, menjelaskan aturan gratifikasi, dan melaporkan sesuai mekanisme bila diperlukan"], "k": 3, "p": "Gratifikasi terkait jabatan harus ditolak atau dilaporkan. Penolakan yang santun menjaga hubungan sekaligus integritas."}, {"id": 67, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Seorang pejabat dinas menelepon dan meminta Kepala Sekolah menerima anak kerabatnya dalam penerimaan murid baru di luar ketentuan. Sikap yang tepat adalah ...", "o": ["Menerima demi menjaga hubungan baik", "Menjelaskan bahwa seleksi mengikuti aturan yang berlaku dan menawarkan informasi prosedur resmi", "Menerima dengan menggeser siswa lain secara diam-diam", "Menolak dengan marah dan mengumumkannya"], "k": 1, "p": "Keadilan bagi semua peserta menuntut ketaatan pada aturan. Penolakan disampaikan santun dan profesional."}, {"id": 68, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Dua guru berselisih sehingga kerja sama tim terganggu. Langkah pertama Kepala Sekolah yang tepat adalah ...", "o": ["Memihak guru yang lebih senior", "Mendengarkan kedua pihak secara terpisah, lalu memfasilitasi pertemuan untuk mencari titik temu berfokus pada kepentingan sekolah", "Memindahkan salah satu guru", "Membiarkan sampai reda sendiri"], "k": 1, "p": "Mediasi yang adil dan berfokus pada kepentingan bersama lebih berkelanjutan daripada memihak atau menghindar."}, {"id": 69, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Beredar kabar bohong di media sosial bahwa Kepala Sekolah menyelewengkan dana. Tindakan yang tepat adalah ...", "o": ["Membalas dengan tuduhan terhadap penyebar", "Mengklarifikasi dengan data secara terbuka dan tenang melalui kanal resmi, serta membuka diri terhadap pemeriksaan", "Mengabaikan sepenuhnya", "Menekan guru agar menghapus unggahan"], "k": 1, "p": "Transparansi dan klarifikasi berbasis data meredam isu tanpa memperkeruh keadaan."}, {"id": 70, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Seorang rekan Kepala Sekolah meminta Anda ikut menyusun laporan kegiatan fiktif agar dana terserap. Respons yang benar adalah ...", "o": ["Ikut serta agar tidak dikucilkan", "Pura-pura tidak tahu", "Meminta imbalan untuk tutup mulut", "Menolak, menjelaskan risikonya, dan melaporkan kepada pihak berwenang bila praktik itu berlanjut"], "k": 3, "p": "Integritas mengharuskan menolak kecurangan, bukan ikut atau membiarkan."}, {"id": 71, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Kepala Sekolah menyadari keputusannya soal jadwal ujian keliru dan merugikan siswa. Sikap yang tepat adalah ...", "o": ["Mempertahankan keputusan agar tidak kehilangan wibawa", "Mengakui kesalahan, memperbaiki keputusan, dan menyampaikan penjelasan kepada pihak terdampak", "Menyalahkan wakil kepala sekolah", "Mengubah jadwal diam-diam"], "k": 1, "p": "Keberanian mengakui kesalahan membangun kepercayaan dan keteladanan."}, {"id": 72, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Menjelang pemilihan kepala daerah, seorang calon meminta dukungan Kepala Sekolah dengan menawarkan bantuan dana untuk sekolah. Sikap yang tepat adalah ...", "o": ["Menjaga netralitas sebagai ASN, menolak ajakan dukungan, dan tidak memanfaatkan fasilitas atau pengaruh sekolah", "Mendukung secara terbuka agar sekolah mendapat bantuan", "Mengajak guru memilih calon tersebut", "Menerima bantuan dengan syarat diam-diam"], "k": 0, "p": "ASN wajib netral. Menukar dukungan dengan bantuan merusak integritas jabatan."}, {"id": 73, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Seorang siswa melaporkan bahwa gurunya sering mengejek di depan kelas hingga ia takut sekolah. Langkah awal Kepala Sekolah yang tepat adalah ...", "o": ["Menganggap laporan itu berlebihan", "Langsung memberhentikan guru tanpa pemeriksaan", "Meminta siswa meminta maaf kepada guru", "Mendengarkan siswa dengan aman, melindungi identitasnya, lalu menelusuri laporan secara adil sesuai mekanisme pencegahan kekerasan"], "k": 3, "p": "Perlindungan anak dan proses yang adil harus berjalan bersamaan."}, {"id": 74, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Kepala Sekolah melihat wakilnya memakai laptop inventaris sekolah untuk usaha pribadi. Tindakan yang tepat adalah ...", "o": ["Menegur secara privat, menjelaskan aturan penggunaan aset, dan menetapkan mekanisme yang jelas", "Membiarkan karena wakil itu bekerja keras", "Mengumumkan pelanggaran itu ke seluruh guru", "Ikut memakai aset sekolah untuk kepentingan sendiri"], "k": 0, "p": "Aset negara tidak boleh dipakai untuk kepentingan pribadi. Pembinaan dilakukan dengan menjaga martabat."}, {"id": 75, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Seorang guru melaporkan dugaan pungutan liar oleh staf, tetapi takut dikucilkan. Kepala Sekolah sebaiknya ...", "o": ["Mengungkapkan nama pelapor kepada staf", "Menyarankan pelapor diam saja", "Melindungi pelapor, memverifikasi laporan secara objektif, dan menindaklanjuti sesuai aturan", "Menghukum pelapor karena merusak suasana"], "k": 2, "p": "Perlindungan pelapor mendorong budaya integritas di sekolah."}, {"id": 76, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Seorang guru mengkritik kebijakan Kepala Sekolah di media sosial dengan nada tajam. Respons yang bijak adalah ...", "o": ["Memberi sanksi karena mencemarkan nama baik", "Membalas di media sosial dengan sindiran", "Mengabaikan sambil menandai guru itu sebagai pembangkang", "Menilai isi kritik, membuka ruang dialog langsung, dan memperbaiki bila kritik benar"], "k": 3, "p": "Kepemimpinan yang matang menerima masukan dan menyalurkannya ke dialog yang konstruktif."}, {"id": 77, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Guru senior yang berpengaruh menekan Kepala Sekolah agar membatalkan kebijakan evaluasi kinerja yang telah disepakati. Sikap yang tepat adalah ...", "o": ["Membatalkan kebijakan demi meredakan tekanan", "Menghukum guru senior", "Menjalankan kebijakan hanya untuk guru lain", "Tetap konsisten pada kebijakan yang berbasis data dan kesepakatan, sambil membuka dialog untuk menyerap kekhawatiran guru"], "k": 3, "p": "Keputusan yang sah dan berbasis data tidak boleh goyah karena tekanan, namun tetap disertai komunikasi."}, {"id": 78, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Dalam penilaian kinerja guru, Kepala Sekolah merasa dekat dengan seorang guru. Sikap yang tepat adalah ...", "o": ["Memberi nilai lebih tinggi karena kedekatan", "Meminta orang lain menilai tanpa kriteria", "Menilai berdasarkan bukti dan rubrik yang sama bagi semua guru, serta mengelola potensi bias", "Menghindari penilaian guru tersebut"], "k": 2, "p": "Objektivitas dan keadilan mensyaratkan kriteria yang sama bagi semua."}, {"id": 79, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Beban tambahan sekolah dibagikan kepada guru yang paling jarang menolak. Akibatnya guru tertentu kelelahan. Kepala Sekolah seharusnya ...", "o": ["Melanjutkan karena guru itu tidak pernah menolak", "Menaikkan tugas sampai guru mengeluh", "Membagi tugas secara adil berdasarkan kompetensi dan beban kerja, serta memantau kesejahteraan guru", "Menyerahkan pembagian kepada guru sendiri tanpa aturan"], "k": 2, "p": "Keadilan beban kerja menjaga kinerja dan kesejahteraan tim."}, {"id": 80, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Wakil kepala sekolah dan koordinator guru berkonflik soal kewenangan jadwal. Pendekatan penyelesaian terbaik adalah ...", "o": ["Mengambil alih seluruh jadwal sendiri", "Memperjelas pembagian peran dalam struktur dan SOP, lalu memfasilitasi kesepakatan bersama", "Menunggu salah satu mengalah", "Mengganti keduanya"], "k": 1, "p": "Konflik peran sering muncul dari ketidakjelasan wewenang. Kejelasan struktur menyelesaikan akar masalah."}, {"id": 81, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Orang tua marah karena anaknya ditegur guru dan mengancam menyebarkan masalah ke media. Langkah Kepala Sekolah adalah ...", "o": ["Membela guru tanpa memeriksa", "Menenangkan suasana, mendengar kedua pihak, memeriksa fakta, dan memfasilitasi penyelesaian yang adil", "Menyalahkan guru di depan orang tua", "Mengabaikan ancaman itu"], "k": 1, "p": "Mediasi yang tenang dan berbasis fakta menjaga hak anak dan martabat guru."}, {"id": 82, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Beberapa siswa dari agama berbeda mengeluhkan perlakuan diskriminatif oleh sebagian teman. Kepala Sekolah sebaiknya ...", "o": ["Menegaskan nilai toleransi, menindak perilaku diskriminatif sesuai aturan, dan memperkuat kegiatan yang membangun saling menghargai", "Menyarankan siswa yang mengeluh untuk beradaptasi", "Menganggap itu urusan pribadi siswa", "Memisahkan siswa berdasarkan kelompok"], "k": 0, "p": "Sekolah wajib menjamin rasa aman dan keadilan bagi semua murid tanpa diskriminasi."}, {"id": 83, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Kepala Sekolah mengetahui seorang guru menyalin karya orang lain sebagai bahan angka kredit. Tindakan yang tepat adalah ...", "o": ["Mengesahkan karena guru itu butuh kenaikan pangkat", "Menyebarkan kasus itu ke seluruh sekolah", "Mengabaikan karena sudah terlanjur", "Memverifikasi, menegur dan membina guru, serta menolak pengesahan karya hasil plagiat"], "k": 3, "p": "Integritas akademik harus dijaga. Pembinaan tetap dilakukan secara bermartabat."}, {"id": 84, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Kepala Sekolah merasa kelelahan akibat beban kerja berat dan mulai mudah marah kepada staf. Sikap paling tepat adalah ...", "o": ["Melampiaskan kepada staf yang dianggap lamban", "Mengabaikan kondisi diri", "Menyerahkan semua tugas tanpa arahan", "Mengelola beban dengan mendelegasikan tugas, mengatur waktu istirahat, dan meminta maaf kepada staf bila bersikap kurang pantas"], "k": 3, "p": "Pengelolaan diri dan tanggung jawab atas sikap menjaga iklim kerja yang sehat."}, {"id": 85, "b": "Kompetensi kepribadian dan kepemimpinan etis", "n": "Kepala Sekolah menetapkan aturan disiplin kehadiran, tetapi ia sendiri sering datang terlambat. Pernyataan yang paling mencerminkan kepemimpinan adalah ...", "o": ["Aturan hanya berlaku untuk guru", "Menjadi teladan lebih dulu dengan mematuhi aturan yang sama dan memperbaiki kebiasaannya", "Pemimpin memiliki kelonggaran waktu", "Aturan dihapus agar adil"], "k": 1, "p": "Keteladanan memberi legitimasi pada aturan dan membangun budaya disiplin."}, {"id": 86, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Komite sekolah mengusulkan iuran wajib bulanan bagi semua orang tua untuk membiayai kegiatan. Sikap Kepala Sekolah adalah ...", "o": ["Menjelaskan perbedaan pungutan dan sumbangan, menegaskan sumbangan bersifat sukarela, dan menolak kewajiban nominal tertentu", "Menyetujui asalkan hasil rapat komite", "Menetapkan nominal sama untuk semua orang tua", "Menyerahkan penagihan sepenuhnya kepada wali kelas"], "k": 0, "p": "Peraturan membolehkan sumbangan sukarela dan melarang pungutan wajib di sekolah negeri."}, {"id": 87, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Orang tua memprotes nilai rapor anaknya dan mendatangi sekolah dengan emosi. Respons terbaik Kepala Sekolah adalah ...", "o": ["Menerima dengan tenang, mendengar keluhan, menelusuri dasar penilaian bersama guru, dan menjelaskan hasilnya secara terbuka", "Meminta orang tua pulang dan kembali nanti", "Mengubah nilai agar orang tua puas", "Menyatakan nilai tidak dapat dipertanyakan"], "k": 0, "p": "Komunikasi empatik dan transparansi dasar penilaian membangun kepercayaan tanpa mengorbankan integritas."}, {"id": 88, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Sebuah perusahaan menawarkan kerja sama praktik kerja bagi siswa SMK dengan syarat siswa bekerja tanpa pendampingan dan tanpa kurikulum jelas. Langkah yang tepat adalah ...", "o": ["Menerima karena perusahaan besar", "Menyusun perjanjian kerja sama yang memuat tujuan belajar, pendampingan, keselamatan, dan penilaian, atau menolak bila tidak dipenuhi", "Menerima dan menyerahkan pengaturan kepada siswa", "Menolak semua kemitraan industri"], "k": 1, "p": "Kemitraan harus menjamin hak belajar dan keselamatan siswa."}, {"id": 89, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Sebuah perusahaan menawarkan dana CSR untuk sekolah, tetapi meminta logonya dipasang di seluruh ruang kelas. Sikap Kepala Sekolah adalah ...", "o": ["Menerima dukungan sepanjang sesuai aturan dan tidak mengganggu proses belajar, dengan perjanjian tertulis dan pengelolaan transparan", "Menolak seluruh dukungan swasta", "Menyetujui tanpa perjanjian", "Menyembunyikan dana itu dari komite"], "k": 0, "p": "Dukungan pihak luar dapat diterima bila akuntabel, tidak membebani siswa, dan tidak merusak lingkungan belajar."}, {"id": 90, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Seorang wartawan menanyakan kabar dugaan kekerasan di sekolah. Langkah Kepala Sekolah yang tepat adalah ...", "o": ["Menyampaikan informasi resmi yang terverifikasi, melindungi identitas anak, dan berkoordinasi dengan dinas bila perlu", "Menolak berbicara dan menghindari wartawan", "Membantah semua tanpa memeriksa", "Menyebut nama siswa agar jelas"], "k": 0, "p": "Komunikasi terbuka dengan perlindungan anak menjaga kepercayaan publik."}, {"id": 91, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Pengawas sekolah menemukan sejumlah kekurangan saat kunjungan. Sikap Kepala Sekolah yang tepat adalah ...", "o": ["Membela diri dan menolak masukan", "Menyalahkan guru di depan pengawas", "Menerima masukan, menyusun rencana tindak lanjut bersama pengawas, dan melaporkan kemajuannya", "Menyembunyikan berkas yang bermasalah"], "k": 2, "p": "Pengawas adalah mitra pembinaan. Tindak lanjut menunjukkan sikap profesional."}, {"id": 92, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Warga sekitar mengeluhkan kebisingan kegiatan sekolah sore hari. Kepala Sekolah sebaiknya ...", "o": ["Mengabaikan karena kegiatan untuk siswa", "Menyuruh warga pindah", "Mengundang perwakilan warga berdialog, menyepakati pengaturan jadwal dan volume, serta menjaga hubungan baik", "Menghentikan seluruh kegiatan sore tanpa diskusi"], "k": 2, "p": "Hubungan dengan masyarakat dijaga melalui dialog dan solusi bersama."}, {"id": 93, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Sekelompok alumni ingin membantu perbaikan perpustakaan. Langkah Kepala Sekolah yang tepat adalah ...", "o": ["Menerima uang secara pribadi", "Menolak karena alumni tidak berwenang", "Membahas kebutuhan bersama, mencatat bantuan secara transparan, dan melibatkan komite dalam pengelolaannya", "Menerima tanpa pencatatan"], "k": 2, "p": "Partisipasi alumni dikelola secara akuntabel dan sesuai kebutuhan."}, {"id": 94, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Seorang orang tua menyebarkan keluhan keras tentang guru di grup pesan orang tua. Respons Kepala Sekolah adalah ...", "o": ["Membalas keras di grup", "Menghapus orang tua dari grup", "Menghubungi orang tua secara langsung, menanggapi isu dengan fakta, dan mengajak komunikasi lewat kanal resmi", "Membiarkan isu berkembang"], "k": 2, "p": "Isu di ruang publik ditangani dengan komunikasi langsung dan data."}, {"id": 95, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Sekolah ingin bekerja sama dengan puskesmas untuk program kesehatan siswa. Langkah paling tepat adalah ...", "o": ["Membiarkan puskesmas datang tanpa koordinasi", "Menyusun kesepakatan kerja sama yang jelas tentang kegiatan, jadwal, dan penanggung jawab, dan melaporkan hasilnya", "Meminta siswa berobat sendiri", "Menunda kerja sama sampai ada masalah"], "k": 1, "p": "Kemitraan efektif memerlukan kesepakatan dan koordinasi yang jelas."}, {"id": 96, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Seorang tokoh masyarakat meminta pengurangan biaya untuk sejumlah siswa tidak mampu, padahal sekolah negeri tidak memungut biaya wajib. Kepala Sekolah sebaiknya ...", "o": ["Menolak karena itu bukan urusan sekolah", "Menjelaskan kebijakan tanpa pungutan, memastikan siswa tidak mampu mendapat akses bantuan resmi, dan memetakan kebutuhan mereka", "Memungut biaya lalu memberi potongan khusus", "Mengumumkan daftar siswa tidak mampu"], "k": 1, "p": "Hak belajar dilindungi dengan layanan tanpa pungutan dan jalur bantuan resmi, serta menjaga martabat siswa."}, {"id": 97, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Terjadi insiden di sekolah yang menjadi perhatian publik. Prinsip komunikasi krisis yang tepat adalah ...", "o": ["Memberi informasi cepat, akurat, dan satu pintu, serta menunjukkan empati dan langkah penanganan", "Menunggu isu mereda", "Membiarkan banyak pihak menjawab", "Menyangkal sebelum memeriksa"], "k": 0, "p": "Komunikasi krisis yang terbuka dan terkoordinasi mencegah spekulasi."}, {"id": 98, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Kepala SMK menandatangani MoU dengan industri, tetapi kegiatan di lapangan berjalan tanpa evaluasi. Tindakan perbaikan yang tepat adalah ...", "o": ["Menyusun mekanisme monitoring dan evaluasi bersama industri berdasarkan indikator kompetensi lulusan", "Mengakhiri MoU", "Membiarkan karena sudah ada MoU", "Menyerahkan evaluasi kepada siswa saja"], "k": 0, "p": "Kemitraan perlu ukuran manfaat dan evaluasi berkala."}, {"id": 99, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Sebuah perguruan tinggi menawarkan program pendampingan bagi guru. Sikap Kepala Sekolah yang tepat adalah ...", "o": ["Menerima tanpa menyesuaikan", "Menolak karena menambah pekerjaan", "Menyesuaikan program dengan kebutuhan hasil pemetaan sekolah dan menyepakati tujuan serta luaran bersama", "Menunjuk guru secara acak"], "k": 2, "p": "Kemitraan paling berguna bila selaras dengan kebutuhan sekolah."}, {"id": 100, "b": "Kompetensi sosial dan kemitraan sekolah", "n": "Dalam penerimaan murid baru, calon peserta didik dari keluarga tidak mampu terkendala persyaratan administratif. Kepala Sekolah sebaiknya ...", "o": ["Menolak karena berkas tidak lengkap", "Meloloskan tanpa syarat", "Menjalankan seleksi sesuai aturan, menjelaskan jalur yang tersedia, dan membantu pemenuhan syarat administratif secara adil", "Menyerahkan urusan kepada orang tua saja"], "k": 2, "p": "Penerimaan murid baru harus objektif, transparan, dan akuntabel, sambil menjamin akses yang adil."}, {"id": 101, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Kantin sekolah dikelola unit usaha dan mulai merugi karena harga bahan naik. Kepala Sekolah sebaiknya ...", "o": ["Menutup kerugian dengan dana BOS", "Menutup kantin tanpa evaluasi", "Menganalisis struktur biaya dan penjualan bersama pengelola, menyesuaikan menu dan harga secara wajar, serta mengevaluasi kinerja usaha secara berkala", "Menaikkan harga sebesar-besarnya agar untung"], "k": 2, "p": "Usaha sekolah dikelola dengan analisis biaya dan pengelolaan yang mandiri. Dana BOS tidak boleh menutup kerugian usaha."}, {"id": 102, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Sekolah ingin membuka koperasi siswa. Beberapa guru khawatir akan mengganggu belajar. Langkah yang tepat adalah ...", "o": ["Merancang koperasi sebagai sarana belajar kewirausahaan dengan pembagian peran, pembukuan jelas, dan pendampingan guru", "Menunjuk guru mengelola penuh tanpa siswa", "Membatalkan karena dianggap mengganggu", "Membuka koperasi tanpa aturan tertulis"], "k": 0, "p": "Unit usaha dapat menjadi pembelajaran bila dirancang dengan tata kelola yang tertib."}, {"id": 103, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Sebuah SMK memiliki unit produksi yang laris, tetapi keuntungannya dipakai tanpa catatan. Tindakan paling tepat adalah ...", "o": ["Membagi keuntungan untuk pengelola", "Memakainya sesuai kebutuhan Kepala Sekolah", "Menetapkan pembukuan terpisah, aturan pembagian hasil, dan pelaporan sesuai ketentuan pengelolaan pendapatan", "Menghentikan produksi"], "k": 2, "p": "Pendapatan sekolah harus tercatat dan dipertanggungjawabkan secara transparan."}, {"id": 104, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Sekolah menjalankan bank sampah, tetapi hasilnya tidak terdata dan siswa kehilangan minat. Langkah perbaikan terbaik adalah ...", "o": ["Menyusun sistem pencatatan, tujuan edukasi, dan umpan balik hasil kepada siswa agar program bermakna", "Menghentikan program", "Menugaskan satu petugas tanpa melibatkan siswa", "Menjadikannya kewajiban tanpa tujuan"], "k": 0, "p": "Program berkelanjutan memiliki tujuan, pencatatan, dan manfaat yang dirasakan peserta."}, {"id": 105, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Setelah pembagian makanan bergizi di sekolah, beberapa siswa mengalami mual dan pusing. Langkah awal Kepala Sekolah yang tepat adalah ...", "o": ["Menunggu apakah gejala bertambah", "Menutup informasi agar tidak panik", "Menyalahkan penyedia di depan siswa", "Mengutamakan keselamatan siswa dengan pertolongan pertama dan rujukan medis, menghubungi orang tua dan dinas, serta menyimpan sampel makanan untuk pemeriksaan"], "k": 3, "p": "Dalam krisis, keselamatan siswa dan pelaporan segera menjadi prioritas."}, {"id": 106, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Banjir merendam sekolah menjelang ujian. Kepala Sekolah harus memutuskan jadwal. Langkah terbaik adalah ...", "o": ["Memaksa ujian tetap berjalan", "Menyatakan ujian batal tanpa koordinasi", "Memastikan keselamatan warga sekolah, berkoordinasi dengan dinas dan komite, lalu menyusun jadwal pengganti serta layanan belajar alternatif", "Menunggu air surut tanpa komunikasi"], "k": 2, "p": "Keputusan krisis memprioritaskan keselamatan dan koordinasi, disertai komunikasi jelas."}, {"id": 107, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Dua pilihan investasi tersedia: laboratorium komputer baru atau pelatihan guru. Dana hanya cukup untuk satu. Data menunjukkan alat lama masih berfungsi, tetapi kompetensi guru rendah. Keputusan terbaik adalah ...", "o": ["Membeli laboratorium karena lebih terlihat", "Mendahulukan pelatihan guru karena sesuai akar masalah, lalu merencanakan peremajaan alat bertahap", "Membagi dana rata sehingga keduanya setengah terlaksana", "Menyerahkan pilihan kepada vendor"], "k": 1, "p": "Keputusan harus mengikuti akar masalah dari data, bukan kesan visual."}, {"id": 108, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Sekolah menerima laporan dugaan kekerasan seksual oleh seorang pegawai terhadap siswa. Langkah Kepala Sekolah yang paling tepat adalah ...", "o": ["Menyelesaikan secara kekeluargaan agar nama sekolah terjaga", "Meminta korban berdamai", "Melindungi korban, menghubungi tim pencegahan dan penanganan kekerasan serta pihak berwenang, dan menjaga kerahasiaan identitas", "Menunggu bukti kuat tanpa tindakan"], "k": 2, "p": "Perlindungan korban dan penanganan sesuai hukum tidak boleh ditutupi."}, {"id": 109, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Seorang sponsor rokok menawarkan dana besar untuk kegiatan olahraga sekolah. Keputusan Kepala Sekolah adalah ...", "o": ["Menerima karena dananya besar", "Menolak karena bertentangan dengan kebijakan perlindungan anak, dan mencari mitra lain yang selaras dengan nilai sekolah", "Menerima tanpa mencantumkan nama sponsor", "Menerima dan menugaskan siswa membagikan produk"], "k": 1, "p": "Sekolah wajib melindungi anak dari paparan promosi rokok."}, {"id": 110, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Tahun ini jumlah pendaftar turun drastis. Pilihan strategi paling tepat adalah ...", "o": ["Mengobral janji yang belum pasti", "Menganalisis penyebab, meningkatkan mutu layanan, dan mengomunikasikan keunggulan sekolah secara jujur kepada masyarakat", "Menurunkan standar penerimaan secara diam-diam", "Menyalahkan sekolah pesaing"], "k": 1, "p": "Daya tarik berkelanjutan berasal dari mutu dan komunikasi jujur."}, {"id": 111, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Sekolah ingin menerapkan produk unggulan berbasis potensi lokal. Langkah awal paling tepat adalah ...", "o": ["Meniru produk sekolah lain", "Menetapkan produk tanpa melibatkan guru", "Menunggu instruksi dinas", "Memetakan potensi daerah, minat siswa, dan sumber daya, lalu merancang pembelajaran kontekstual bersama mitra lokal"], "k": 3, "p": "Inovasi lokal berangkat dari potensi nyata dan keterlibatan pemangku kepentingan."}, {"id": 112, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Guru kontrak yang sangat dibutuhkan akan habis masa kerjanya, sedangkan sekolah belum memiliki pengganti. Kepala Sekolah sebaiknya ...", "o": ["Memperpanjang secara tidak resmi", "Membiarkan hingga kelas kosong", "Meminta guru bekerja tanpa status", "Mengusulkan perpanjangan atau formasi sesuai aturan dengan data kebutuhan, dan menyiapkan transisi tugas"], "k": 3, "p": "Pengelolaan SDM mengikuti aturan, dengan perencanaan yang menjamin keberlanjutan layanan."}, {"id": 113, "b": "Studi kasus keputusan kompleks dan kewirausahaan sekolah", "n": "Kepala Sekolah menerima dua perintah berbeda dari dua pejabat atasan terkait pelaksanaan satu kegiatan. Langkah tepat adalah ...", "o": ["Mengklarifikasi secara tertulis kepada kedua pihak melalui jalur resmi dan melaksanakan sesuai kesepakatan yang jelas", "Menjalankan perintah yang pertama diterima", "Menjalankan perintah yang paling menguntungkan", "Mengabaikan keduanya"], "k": 0, "p": "Konflik perin function finish(auto){clearInterval(tm);const ok=qs.filter((q,k)=>ans[k]==q.k).length,em=ans.filter(a=>a<0).length;
